<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.home %}Condux — 여러 AI를 부리는 Mac 작업실{% else %}{{ page.title | escape }} — Condux{% endif %}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta property="og:title" content="Condux — 여러 AI를 부리는 Mac 작업실">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:image" content="{{ '/images/conversation-dark.png' | absolute_url }}">
  <meta name="theme-color" content="#18191d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)">
  <link rel="icon" href="{{ '/condux-icon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/site.css' | relative_url }}">
</head>
<body class="{% if page.home %}home-page{% else %}document-page{% endif %}">
  <a class="skip-link" href="#main">본문으로 바로 가기</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Condux 홈">
        <img src="{{ '/condux-icon.png' | relative_url }}" width="28" height="28" alt="">
        <span>Condux</span>
      </a>
      <nav aria-label="주요 메뉴">
        <a href="{{ '/#features' | relative_url }}">기능</a>
        <a href="{{ '/guide.html' | relative_url }}"{% if page.name == 'guide.md' %} aria-current="page"{% endif %}>가이드</a>
        <a href="{{ '/#faq' | relative_url }}">질문</a>
        <a class="nav-strong" href="https://github.com/pgup3017/condux-app">GitHub</a>
      </nav>
    </div>
  </header>
  {% if page.home %}
  <main id="main" tabindex="-1">{{ content }}</main>
  {% else %}
  <main id="main" class="container document-main" tabindex="-1">
    <article class="document-content">{{ content }}</article>
  </main>
  {% endif %}
  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/condux-icon.png' | relative_url }}" width="24" height="24" alt=""><span>Condux</span></a>
      <nav aria-label="추가 안내">
        <a href="{{ '/guide.html' | relative_url }}">사용 가이드</a>
        <a href="{{ '/guide-en.html' | relative_url }}">English guide</a>
        <a href="{{ '/privacy.html' | relative_url }}"{% if page.name == 'privacy.md' %} aria-current="page"{% endif %}>개인정보 처리방침</a>
        <a href="https://github.com/pgup3017/condux-app/issues">문의</a>
      </nav>
    </div>
    <div class="container footer-note">Condux 는 독립 프로젝트이며 Anthropic, OpenAI, GitHub 와 제휴 관계가 없습니다.</div>
  </footer>
</body>
</html>
