<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.home %}Condux — 여러 AI와 함께하는 Mac 작업실{% else %}{{ page.title | escape }} | Condux{% endif %}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="{{ '/condux-icon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/site.css' | relative_url }}">
</head>
<body class="{% if page.home %}home-page{% else %}document-page{% endif %}">
  <a class="skip-link" href="#main">본문으로 바로 가기</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Condux 지원 홈">
        <img src="{{ '/condux-icon.png' | relative_url }}" width="28" height="28" alt="">
        <span>Condux</span>
      </a>
      <nav aria-label="주요 메뉴">
        <a href="{{ '/' | relative_url }}"{% if page.home %} aria-current="page"{% endif %}>소개</a>
        <a href="{{ '/guide.html' | relative_url }}"{% if page.name == 'guide.md' %} aria-current="page"{% endif %}>사용 가이드</a>
        <a href="{{ '/#faq' | relative_url }}">자주 묻는 질문</a>
        <a href="{{ '/#contact' | relative_url }}">문의하기</a>
      </nav>
    </div>
  </header>
  {% if page.home %}
  <main id="main" tabindex="-1">{{ content }}</main>
  {% else %}
  <main id="main" class="container document-main" tabindex="-1">
    <a class="back-link" href="{{ '/' | relative_url }}">← 지원 홈으로</a>
    <article class="document-content">{{ content }}</article>
  </main>
  {% endif %}
  <footer class="site-footer">
    <div class="container footer-inner">
      <div><a class="brand footer-brand" href="{{ '/' | relative_url }}"><img src="{{ '/condux-icon.png' | relative_url }}" width="28" height="28" alt=""><span>Condux</span></a><p>Mac을 위한 AI 작업실.</p></div>
      <nav aria-label="추가 안내">
        <a href="{{ '/guide.html' | relative_url }}">사용 가이드</a>
        <a href="{{ '/privacy.html' | relative_url }}"{% if page.name == 'privacy.md' %} aria-current="page"{% endif %}>개인정보 처리방침</a>
      </nav>
    </div>
    <div class="container footer-bottom"><span>© 2026 Condux</span><span>사용 안내 및 지원</span></div>
  </footer>
</body>
</html>
